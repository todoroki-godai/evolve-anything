name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 実時刻で劣化する fixture/TTL を、コード変更がない週にも検出する。
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  distribution:
    name: Distribution contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[core]"
      - name: Check manifests, JSON, skill frontmatter, and CLI startup
        run: python scripts/check_distribution.py

  pytest:
    name: Portable pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            extras: "dev,analysis"
          - python-version: "3.12"
            extras: "dev"
          - python-version: "3.13"
            extras: "dev"
          - python-version: "3.14"
            extras: "dev"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install build backend for metadata tests
        run: python -m pip install --upgrade setuptools
      - name: Install project and test dependencies
        run: python -m pip install -e ".[${{ matrix.extras }}]"
      # The repository-wide suite also contains host-bound ~/.claude checks and
      # OS/Python-specific API snapshots. Keep the clean-runner matrix focused
      # on the portable distribution contracts introduced by #266; the full
      # suite remains a local/dogfood gate until those legacy tests are made
      # hermetic.
      - name: Run portable contract suite
        run: >-
          python -m pytest -q
          scripts/lib/tests/test_distribution_check.py
          scripts/tests/test_dependency_metadata.py
          scripts/tests/test_readme_drift.py
